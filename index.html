<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programare online – Freya Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --crem: #f9f4f0;
      --crem-inchis: #efe5db;
      --bronz: #a37b52;
      --auriu: #c19a6b;
      --maro: #4a3a2e;
      --gri: #8a7a6c;
      --rosu: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      font-family: "Montserrat", system-ui, sans-serif; color: var(--maro);
      background: linear-gradient(160deg, var(--crem) 0%, var(--crem-inchis) 100%);
    }
    .card {
      max-width: 520px; margin: 0 auto; background: var(--crem);
      border: 1px solid #e6d8ca; border-radius: 18px; padding: 28px 24px 32px;
      box-shadow: 0 10px 40px rgba(120, 90, 60, .12);
    }
    .logo { display: block; width: 230px; max-width: 70%; margin: 0 auto 6px; }
    h1 {
      font-family: "Cormorant Garamond", serif; font-weight: 600; color: var(--bronz);
      text-align: center; font-size: 30px; letter-spacing: 1px; margin: 4px 0 2px;
    }
    .sub { text-align: center; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gri); margin: 0 0 8px; }
    .linie { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
    .linie::before, .linie::after { content: ""; flex: 1; height: 1px; background: #dcc9b6; }
    .linie span { color: var(--auriu); font-size: 14px; }
    label.camp { display: block; font-size: 13px; font-weight: 600; margin: 18px 0 6px; letter-spacing: .3px; }
    input[type=text], input[type=tel], input[type=date] {
      width: 100%; padding: 12px 14px; font: inherit; font-size: 15px; color: var(--maro);
      background: #fff; border: 1px solid #dfcfbf; border-radius: 10px; outline: none;
    }
    input:focus { border-color: var(--auriu); box-shadow: 0 0 0 3px rgba(193, 154, 107, .2); }
    small { display: block; color: var(--gri); font-size: 12px; margin-top: 5px; }

    /* servicii */
    .servicii { background: #fff; border: 1px solid #dfcfbf; border-radius: 10px; max-height: 330px; overflow-y: auto; }
    .serviciu { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #f1e7dd; cursor: pointer; font-size: 14px; }
    .serviciu:last-child { border-bottom: 0; }
    .serviciu input { margin-top: 3px; accent-color: var(--bronz); width: 16px; height: 16px; flex: none; }
    .serviciu .nume { flex: 1; }
    .serviciu .detalii { white-space: nowrap; color: var(--bronz); font-size: 12px; font-weight: 600; text-align: right; }
    .serviciu.bifat { background: #fbf6f1; }
    .total {
      display: flex; justify-content: space-between; margin-top: 10px; padding: 10px 14px;
      background: #f3e9df; border-radius: 10px; font-size: 14px; font-weight: 600;
    }

    /* ore */
    .sloturi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .slot {
      padding: 10px 0; font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer;
      background: #fff; color: var(--maro); border: 1px solid #dfcfbf;
    }
    .slot:hover { border-color: var(--auriu); }
    .slot.ales { background: var(--bronz); color: #fff; border-color: var(--bronz); }
    .slot.ocupat {
      background: #fbeaea; color: var(--rosu); border-color: #f0c9c4;
      text-decoration: line-through; cursor: not-allowed;
    }
    .mesaj { font-size: 13px; color: var(--gri); padding: 10px 0; }

    .trimite {
      margin-top: 26px; width: 100%; padding: 14px; border: 0; border-radius: 30px; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: #fff; background: linear-gradient(135deg, var(--auriu), var(--bronz));
      box-shadow: 0 6px 18px rgba(163, 123, 82, .35);
    }
    .trimite:disabled { opacity: .6; cursor: wait; }
    .eroare { color: var(--rosu); font-size: 13px; margin-top: 10px; text-align: center; }
    .multumim { text-align: center; padding: 20px 0; line-height: 1.6; }
    .multumim h2 { font-family: "Cormorant Garamond", serif; color: var(--bronz); font-size: 28px; margin: 0 0 10px; }
    .contact { text-align: center; font-size: 12px; color: var(--gri); margin-top: 22px; line-height: 1.7; }
    .contact a { color: var(--bronz); text-decoration: none; font-weight: 600; }
  </style>
</head>

    const PAS_MINUTE     = 30;             // din cat in cat apar orele
    const ZILE_LUCRU     = [1, 2, 3, 4, 5, 6]; // 1=Luni ... 6=Sambata, 0=Duminica

    // webhook-ul din Make care spune ce ore sunt OCUPATE intr-o zi.
    // Cat timp e gol, formularul arata toate orele ca libere.
    const URL_ORE_OCUPATE = "https://hook.eu1.make.com/31vhk9it86o9yypvi88247kwe4qhrgxs";

    const SERVICII = [
      { nume: "Consultație cosmetică gratuită & plan personalizat", durata: 20, pret: 0 },
      { nume: "Curățare & Hidratare Facială",            durata: 75, pret: 300 },
      { nume: "Curățare Profundă & Echilibrare",         durata: 90, pret: 350 },
      { nume: "Acne Control – Purificare & Echilibrare", durata: 90, pret: 400 },
      { nume: "Calm & Repair – Ten sensibil și reactiv", durata: 75, pret: 350 },
      { nume: "Hidratare & Luminozitate",                durata: 75, pret: 300 },
      { nume: "Glow – Ritual de Strălucire",             durata: 60, pret: 350 },
      { nume: "Rejuvenare & Fermitate",                  durata: 90, pret: 400 },
      { nume: "CO₂ Carboxy Therapy",                     durata: 60, pret: 350 },
      { nume: "Peeling Chimic Profesional",              durata: 60, pret: 400 },
      { nume: "Microneedling Facial",                    durata: 60, pret: 400 },
      { nume: "Microneedling Scalp",                     durata: 60, pret: 450 },
      { nume: "Microneedling Sprâncene",                 durata: 20, pret: 200 },
      { nume: "Microneedling Barbă",                     durata: 60, pret: 350 },
      { nume: "Biomicroneedling cu Spiculi",             durata: 60, pret: 350 },
      { nume: "Biomicroneedling cu Spiculi SQT – Corp",  durata: 60, pret: 450, delaPret: true }, // 450-650 lei
    ];
    // ===============================================================

    const $ = id => document.getElementById(id);
    const inMinute = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const inOra = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

    let oreOcupate = [];   // [{start: minute, durata: minute}]
    let oraAleasa = "";

    // ---- lista de servicii ----
    SERVICII.forEach((s, i) => {
      const rand = document.createElement("label");
      rand.className = "serviciu";
      const pret = s.pret === 0 ? "Gratuit" : (s.delaPret ? "de la " : "") + s.pret + " lei";
      rand.innerHTML = `<input type="checkbox" data-i="${i}"><span class="nume">${s.nume}</span>
                        <span class="detalii">${s.durata} min<br>${pret}</span>`;
      $("lista-servicii").appendChild(rand);
    });
    $("lista-servicii").addEventListener("change", e => {
      e.target.closest(".serviciu").classList.toggle("bifat", e.target.checked);
      actualizeazaTotal();
      deseneazaOre();
    });

    function serviciiAlese() {
      return [...document.querySelectorAll("#lista-servicii input:checked")].map(c => SERVICII[c.dataset.i]);
    }

    function actualizeazaTotal() {
      const alese = serviciiAlese();
      const durata = alese.reduce((t, s) => t + s.durata, 0);
      const pret = alese.reduce((t, s) => t + s.pret, 0);
      const dela = alese.some(s => s.delaPret) ? "de la " : "";
      const ore = durata >= 60 ? `${Math.floor(durata / 60)}h ${durata % 60 ? (durata % 60) + " min" : ""}` : `${durata} min`;
      $("total-text").textContent = `${ore.trim()} · ${dela}${pret} lei`;
      $("serviciul_dorit").value = alese.map(s => s.nume).join(", ");
      $("durata_minute").value = durata;
      $("pret_total").value = dela + pret;
    }

    // ---- data ----
    const azi = new Date();
    $("data_dorita").min = new Date(azi.getTime() - azi.getTimezoneOffset() * 60000).toISOString().split("T")[0];
    $("data_dorita").addEventListener("change", incarcaOreOcupate);

    async function incarcaOreOcupate() {
      oreOcupate = [];
      const data = $("data_dorita").value;
      if (!data || !URL_ORE_OCUPATE) return deseneazaOre();
      $("zona-ore").innerHTML = '<div class="mesaj">Se încarcă orele disponibile…</div>';
      try {
        // Make raspunde cu text de forma: 15:00|60;17:30|90
        const r = await fetch(URL_ORE_OCUPATE + "?data=" + encodeURIComponent(data));
        const text = (await r.text()).trim();
        oreOcupate = text.split(";").map(x => x.replace(/'/g, "").trim())
          .filter(x => /^\d{1,2}:\d{2}\|/.test(x))          // ignora randurile fara ora
          .map(x => {
            const [ora, durata] = x.split("|");
            return { start: inMinute(ora), durata: parseInt(durata) || PAS_MINUTE };
          });
      } catch (e) {
        console.warn("Nu am putut citi orele ocupate", e);
      }
      deseneazaOre();
    }

    // ---- orele ----
    function deseneazaOre() {
      const zona = $("zona-ore");
      const data = $("data_dorita").value;
      const durata = parseInt($("durata_minute").value) || 0;
      if (!durata || !data) { zona.innerHTML = '<div class="mesaj">Alege întâi serviciile și data.</div>'; return setOra(""); }

      const zi = new Date(data + "T12:00").getDay();
      if (!ZILE_LUCRU.includes(zi)) { zona.innerHTML = '<div class="mesaj">În această zi salonul este închis. Alege altă zi.</div>'; return setOra(""); }

      const eAzi = data === $("data_dorita").min;
      const acum = azi.getHours() * 60 + azi.getMinutes();
      const grila = document.createElement("div");
      grila.className = "sloturi";
      let libere = 0;

      for (let start = inMinute(ORA_DESCHIDERE); start + durata <= inMinute(ORA_INCHIDERE); start += PAS_MINUTE) {
        if (eAzi && start <= acum) continue;              // ore din trecut – nu apar
        const ocupat = oreOcupate.some(o => start < o.start + o.durata && o.start < start + durata);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "slot" + (ocupat ? " ocupat" : "") + (inOra(start) === oraAleasa && !ocupat ? " ales" : "");
        b.textContent = inOra(start);
        if (ocupat) { b.disabled = true; b.title = "Ora este ocupată"; }
        else { libere++; b.onclick = () => { setOra(inOra(start)); deseneazaOre(); }; }
        grila.appendChild(b);
      }
      zona.innerHTML = "";
      if (!grila.children.length || !libere) {
        zona.innerHTML = '<div class="mesaj">Nu mai sunt ore libere în această zi pentru serviciile alese. Încearcă altă zi.</div>';
      }
      if (grila.children.length) zona.appendChild(grila);
      if (![...grila.children].some(b => b.classList.contains("ales"))) setOra("");
    }

    function setOra(o) { oraAleasa = o; $("ora_dorita").value = o; }

    // ---- trimiterea ----
    $("formular").addEventListener("submit", async e => {
      e.preventDefault();
      const f = e.target, err = $("eroare");
      err.textContent = "";
      if (!f.nume.value.trim()) return err.textContent = "Completează numele.";
      if (!/^\+?[0-9]{9,15}$/.test(f.telefon.value.trim())) return err.textContent = "Numărul de telefon nu este valid.";
      if (!serviciiAlese().length) return err.textContent = "Alege cel puțin un serviciu.";
      if (!f.data_dorita.value) return err.textContent = "Alege data.";
      if (!oraAleasa) return err.textContent = "Alege ora.";

      $("buton").disabled = true;
      $("buton").textContent = "Se trimite…";
      try {
        await fetch(f.action, { method: "POST", mode: "no-cors", body: new URLSearchParams(new FormData(f)) });
        const [a, l, z] = f.data_dorita.value.split("-");
        f.outerHTML = `<div class="multumim"><h2>Mulțumim, ${f.nume.value.trim().split(" ")[0]}!</h2>
          Programarea pentru <b>${z}.${l}.${a}</b>, ora <b>${oraAleasa}</b> a fost trimisă.<br>
          Te contactăm în curând pentru confirmare.</div>`;
      } catch (e2) {
        $("buton").disabled = false;
        $("buton").textContent = "Trimite programarea";
        err.textContent = "Nu s-a putut trimite. Încearcă din nou sau sună-ne la 0721 224 363.";
      }
    });
  </script>
</body>
</html>
